name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # shellcheck is pinned instead of the runner's package: the findings differ
  # between releases, the pin keeps CI and the workstations on the same ruleset
  lint:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: 0.11.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v10.3.0

      - name: golangci-lint
        run: make lint.golangci

      - name: install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: shellcheck
        run: make lint.shellcheck

      - name: gitattributes
        run: make lint.gitattributes

      - name: pre-commit
        run: make lint.pre-commit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test with coverage
        run: make test.coverage

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/
          if-no-files-found: ignore
