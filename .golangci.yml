version: "2"
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5 # exhaustruct's name since golangci-lint 2.13
    - forbidigo # a CLI prints with fmt.Print*: reporting to stdout is the product
    - godox
    - gomodguard # deprecated since v2.12.0, replaced by gomodguard_v2
    - nlreturn
    - noinlineerr
    - testpackage # tests drive real git repositories and poke unexported helpers
    - wsl # replaced upstream by wsl_v5, which stays on
  settings:
    cyclop:
      max-complexity: 20
    dupl:
      threshold: 250
    funlen:
      lines: 120
    gocognit:
      min-complexity: 20
    interfacebloat:
      max: 10
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        - generic
    lll:
      line-length: 120
    tagliatelle:
      case:
        rules:
          yaml: snake
        use-field-name: true
    varnamelen:
      ignore-names:
        - err
        - ok
        - id
        - fn
        - r
        - p
        - c
        - st
        - sm
        - sh
        - tc
        - v
        - m
        - f
        - s
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
      ignore-package-globs:
        - github.com/grinderz/repo-tools/*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - dupl
          - err113 # a test's throwaway error is matched by nobody
          - funlen
          - goconst
          - gosec
          - mnd
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/grinderz/repo-tools)
      custom-order: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
