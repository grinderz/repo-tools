# repo-tools configuration.
#
# Copy to config.yaml and adjust. config.yaml is gitignored: it holds the real
# project list and remote URLs.
#
# Projects are processed strictly in the order they appear below, so put
# libraries before the projects that consume them as submodules.

projects_dir: ~/src/projects

# Commands run by changelog update, in order, in each project directory. Each one
# redirects to the file it generates; changelog update commits whatever changed.
# {rt} expands to this binary, so changelog gen needs no rt on PATH.
changelog_cmds:
  - "git-cliff --repository ./ | sed 's/\\r$//' > CHANGELOG-cliff.md"
  - "{rt} changelog gen --header '# CHANGELOG of {project}' > CHANGELOG-git.md"

# Environment for those commands. Values take the same placeholders.
changelog_env:
  GIT_CLIFF_CONFIG: ".dev-include/config/cliff.toml"
  GIT_CLIFF__CHANGELOG__HEADER: "# Changelog of {project}\n\n"

# Check submodules out before generating, needed when the git-cliff config
# lives in one of them. Default true.
changelog_init_submodules: true

# Dependency commands, keyed by the kind a project names in its deps field.
# Nothing is built in: a project with deps: uv runs exactly what is listed
# here, in order, in its directory. deps freeze and deps submodules run them
# after moving the submodule pins; --no-deps skips them for one run.
deps_cmds:
  uv:
    - "uv sync"
  go:
    - "make deps.update.internal"

# Where a deps kind keeps the refs of its internal dependencies when those are
# not submodules. A go project consumes its libraries through go.mod, and the
# refs they are resolved from live in a make variable that the deps command
# walks; deps freeze moves every ref whose module is another project in this
# config onto that project's branch, the same rule freeze_to: project follows.
# A module that is no project here stops the command: the list is internal
# dependencies, so an unknown one means this config is missing a project.
# Leave the key out and only .gitmodules gets frozen.
deps_pins:
  go:
    file: Makefile
    var: GO_DEPS_UPDATE_INTERNAL

# The release this set of projects belongs to, e.g. a calendar version. Every
# template can use it as {product_version}; leave it out if there is no such
# thing, and no template may then mention it.
product_version: ""

# Placeholders in message templates: {project} and {branch} everywhere,
# {product_version} when it is set above, and {version} — the computed tag —
# only in the two tag messages.
rc_tag_message: |
  release candidate {version}

  {commit_count} commit(s) since the previous tag:
  {commits}
release_tag_message: "release {version}"
changelog_commit_message: "chore(changelog): update changelog [skip ci]"
freeze_commit_message: "chore(deps): freeze dependencies for {branch}"
submodules_commit_message: "chore(deps): update submodules on {branch}"

# Show the staged diff and ask before every commit. Default true; the --diff
# and --no-diff flags override it per run.
diff: true

# Show review bodies through a pager on a terminal, the way a package manager
# shows a diff. Unset means $PAGER, then "less -R"; "" prints instead. A
# one-line body is printed either way — there is nothing to scroll. The default
# has no -F and no -X: a short diff opens as well instead of flashing past into
# the prompt, and quitting the pager brings the terminal back to the plan.
pager: "less -R"

# The pipeline watch. A project with ci: gitlab or ci: github gets the
# pipeline of every pushed commit and tag watched through glab or gh — the
# CLIs also carry the authentication, so rt holds no tokens. A failed pipeline
# fails the step; no pipeline appearing within two minutes is a warning (a
# [skip ci] commit is recognized and not watched at all); --no-ci skips the
# watch for one run. These two tune the polling:
ci_poll_seconds: 10       # how often to ask again
ci_wait_minutes: 30       # how long a pipeline may run before the watch gives up
ci_retries: 1             # retry a failed pipeline this many times (failed jobs only)

# When printing rather than paging — a pipe, a CI log — cut the body after this
# many lines and say how to see the rest. 0 prints all of it.
diff_lines: 200

# Colour diffs, warnings and errors. Unset means colour when a terminal is
# attached and plain output through a pipe; --color and --no-color override it.
color: true

# Let a project leave its submodules list out: every submodule whose url is
# another project in this config is then frozen to that project's branch —
# its release_branch when set, its dev branch otherwise. Default true.
derive_submodules: true

# Run the project's own commands (deps_cmds, changelog_cmds) through
# "direnv exec" when the project has an .envrc, so its GOPROXY, GOPRIVATE or
# index URLs apply. Default true; does nothing without direnv or .envrc.
direnv: true

# Commands this config has no business running, by their name under rt. A group
# name disables everything under it, and a name that is not a command is a
# config error. A dev config keeps release-only work out this way.
disable:
  - "deps freeze"

# The table repo report prints, one entry per column: a markdown header cell
# and a value template. Templates take {project}, {branch}, {product_version},
# {commit} (short head of the target branch), {subject} (its commit subject)
# and {tag} (highest tag of the branch's release line, or of the repository
# when the branch is not a release one; missing facts render as "-"). A
# placeholder can chain fallbacks: {tag|branch} renders the first fact that
# exists, so an untagged line reports its branch instead of a dash. A dev
# config reports commits, a release config tags — same command, different
# table. Left out entirely, the table is project | branch | commit.
report:
  - column: Project
    value: "{project}"
  - column: Commit
    value: "`{commit}`"

# Named command sequences, run in order by rt flow <name> [project...]. Steps
# are command names the way disable writes them; each one plans, asks and
# executes exactly as if typed by hand. The first failure or declined plan
# stops the flow. The whole block is validated on every rt start: a typo, a
# group name or a nested flow is a config error at once, and a disabled
# command stops the flow before anything runs.
# This example is a dev config (deps freeze is disabled above), so its flow is
# the everyday routine; a release config would define the whole release
# instead: repo sync, release branch, repo check, deps freeze, release rc,
# changelog update.
flows:
  daily:
    - "repo sync"
    - "repo check"

# always:      ask before every command (default)
# destructive: ask only before what commits, pushes or tags
# never:       never ask (CI)
confirm: always

# Per-project settings that are the same nearly everywhere. A project may
# override any of them; what is set nowhere falls back to the built-in value
# (dev_branch develop, release_branch_prefix release-, deps none, and both
# toggles off).
defaults:
  dev_branch: develop
  changelog_branch: ""    # empty means dev_branch; "release" means release_branch
  release_branch_prefix: release-
  deps: none              # a key of deps_cmds, or none
  ci: none                # watch pipelines after pushes: gitlab (glab), github (gh), none
  changelog: true
  deps_freeze: true
  release_tags: true      # release rc / release tag; on unless set to false

projects:
  # A shared makefile/tooling repository used as a submodule elsewhere.
  - name: dev-include
    git: git@git.example.com:group/dev-include.git
    changelog: false
    deps_freeze: false

  # A python library consumed by the services below. Its submodules list could
  # be left out: .dev-include is a project here, so it would be frozen to the
  # branch that project works on (see derive_submodules).
  - name: pylib
    git: git@git.example.com:group/pylib.git
    deps: uv
    submodules:
      - path: .dev-include
        freeze_to: develop

  # A go library. Consumed by branch, never by version, so it gets release
  # branches but no tags. fetch: false keeps every command off its remote,
  # which is what a repository behind another credential wants.
  - name: golib
    git: git@git.example.com:group/golib.git
    deps: go
    release_tags: false
    fetch: false
    submodules:
      - path: .dev-include
        freeze_to: develop

  # A python service. freeze_to names the branch a submodule tracks on the
  # release branch: an explicit name, or "release" for the highest release-X.Y
  # branch of the submodule's own remote.
  - name: api
    git: git@git.example.com:group/api.git
    deps: uv
    release_branch: ""        # e.g. release-6.8 in a per-release config
    changelog_branch: ""      # empty means dev_branch; "release" means release_branch
    submodules:
      - path: pylib
        freeze_to: develop    # or: release
      - path: .dev-include
        freeze_to: develop
    project_dir: ""           # wins over the global projects_dir

  # A go service that releases from another branch than the default, keeps its
  # git-cliff config in the repository instead of the shared submodule, and
  # generates its changelog its own way.
  - name: worker
    git: git@git.example.com:group/worker.git
    deps: go
    dev_branch: main
    changelog_env:            # merged over the global map, key by key
      GIT_CLIFF_CONFIG: "cliff.toml"
    changelog_cmds:           # replaces the global list outright
      - "make changelog"
    deps_cmds:                # replaces the commands of its deps kind
      - "go mod tidy"
      - "go mod vendor"
    submodules:
      - path: .dev-include
        freeze_to: develop
